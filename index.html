<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChocOS</title>
    <link rel="stylesheet" href="global_styles.css">
</head>
<body>
    <div class="screen">
        <header>
            <span class="notifBar left">
                <li class="time">00:25</li>
            </span>                
            <span class="notifBar right">
                <li><img class="wifi" src="img/wi-fi.png"></li>
                <li><img class="mobileData" src="img/mobile-data.png"></li>
                <li><span style="   color: white; font-size: 20px;">80%</span><img class="battery" src="img/full-battery.png"></li>
            </span>
        </header>

        <div class="grid" id="menu">
                <span>
                    <img class="icon settings" src="img/cogwheel.png">
                </span>
                <span>
                    <img class="icon browser" src="img/browser.png">
                </span>
                <span>
                    <img class="icon camera" src="img/camera.png">
                </span>
                <span>
                    <img class="icon gallery" src="img/gallery.png">
                </span>
                <span >
                    <img class="icon clock" src="img/clock.png">
                </span>
                <span>
                    <img class="icon messages" src="img/comment.png">
                </span>
                <span>
                    <img class="icon fileExplorer" src="img/app.png">
                </span>
                <span>
                    <img class="icon gps" src="img/placeholder.png">
                </span>
        </div>

        <footer>
            <li><img class="button tabs" src="img/tabs.png"></li>
            <li><img class="button home" src="img/home.png"></li>
            <li><img class="button back" src="img/back.png"></li>
        </footer>
    </div>
    
</body>
</html>
